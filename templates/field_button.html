{% macro field_name(name, index) -%}
  <div class="field_box">
  <label class="switch">
    <input type="checkbox" id="field_name_{{ index }}" onclick="selectField({{ index }})" checked>
    <span class="slider"></span>  
  </label> <span class="button colour_{{ index }}"> {{ name }} </span>  
  </div>
{%- endmacro %}
